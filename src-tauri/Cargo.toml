[package]
name = "nanabobo"
version = "0.1.0"
description = "Nana播播工具箱"
authors = ["sena-nana"]
edition = "2021"

[lib]
name = "nanabobo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api"] }
tauri-plugin-lilia = { git = "https://github.com/sena-nana/LiliaUI", rev = "fefcd3bc4a4a454276f2162bc21ab4faef14fd3f" }
tauri-plugin-store = "2"
brotli = "8"
flate2 = "1.1"
futures-util = "0.3"
keyring = { version = "3.6", features = ["windows-native"] }
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]

[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
