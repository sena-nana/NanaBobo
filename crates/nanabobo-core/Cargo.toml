[package]
name = "nanabobo-core"
version = "0.1.0"
description = "Nana播播工具箱业务核心:第三方 B 站接口适配、凭据存取与应用命令"
authors = ["sena-nana"]
edition = "2021"

# 依赖刻意保持自包含(不继承 workspace),使独立构建(如迁移期的
# src-tauri 薄壳)与本 workspace 看到完全一致的版本。

[dependencies]
brotli = "8"
flate2 = "1.1"
futures-util = "0.3"
keyring = { version = "3.6", features = ["windows-native"] }
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
