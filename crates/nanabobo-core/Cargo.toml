[package]
name = "nanabobo-core"
version = "0.1.0"
description = "Nana播播工具箱业务核心:第三方 B 站接口适配、凭据存取与应用命令"
authors = ["sena-nana"]
edition = "2021"

# 依赖刻意保持自包含(不继承 workspace),使独立构建与本 workspace
# 看到完全一致的版本。

[dependencies]
brotli = "9"
flate2 = "1.1"
futures-util = "0.3"
keyring = { version = "4", default-features = false, features = ["v1"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
